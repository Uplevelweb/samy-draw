<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#BFE9FF;
    --sky-bottom:#EAE0FF;
    --ink:#2E2A4A;
    --sun:#FFCB47;
    --coral:#FF6B6B;
    --leaf:#4CAF7D;
    --grape:#6C4AB6;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    font-family:'Nunito',sans-serif;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
    color:var(--ink);
    touch-action:none;
  }
  h1,h2,.title-font,button{font-family:'Baloo 2',sans-serif;}

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* ---------- Header ---------- */
  header{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:8px 12px 6px;flex-shrink:0;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:22px;font-weight:800;color:var(--grape);
    text-shadow:0 2px 0 #ffffffaa;
  }
  .brand .dot{color:var(--coral);}
  .modebar{display:flex;align-items:center;justify-content:center;gap:10px;}

  .group-photo{
    width:150px;height:auto;border-radius:16px;object-fit:cover;
    border:3px solid #ffffffdd;box-shadow:0 4px 8px rgba(46,42,74,0.3);
    animation:bob 3.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-1.5deg);}
    50%{transform:translateY(-6px) rotate(1.5deg);}
  }
  .modebtn{
    border:none;border-radius:999px;padding:10px 20px;font-size:17px;font-weight:700;
    background:#ffffffaa;color:var(--ink);cursor:pointer;
    box-shadow:0 3px 0 rgba(46,42,74,0.15);
    transition:transform .12s ease;
  }
  .modebtn.active{background:var(--grape);color:#fff;box-shadow:0 3px 0 #4c3388;}
  .modebtn:active{transform:translateY(2px);box-shadow:none;}

  /* ---------- Gallery (coloring template picker) ---------- */
  #gallery{
    flex:1;overflow-y:auto;padding:8px 14px 20px;display:none;min-height:0;
  }
  #gallery.visible{display:block;}
  #gallery h2{text-align:center;margin:4px 0 14px;font-size:22px;}
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    max-width:520px;margin:0 auto;
  }
  .tpl{
    background:var(--card);border-radius:18px;border:none;padding:8px;
    box-shadow:0 4px 0 rgba(46,42,74,0.12);cursor:pointer;
  }
  .tpl:active{transform:translateY(2px);box-shadow:none;}
  .tpl canvas{width:100%;display:block;border-radius:10px;background:#fff;}
  .tpl span{display:block;text-align:center;margin-top:6px;font-weight:700;font-size:13px;}

  /* ---------- Canvas area ---------- */
  #canvasWrap{
    flex:1;display:none;align-items:center;justify-content:center;
    padding:6px 10px;min-height:0;
  }
  #canvasWrap.visible{display:flex;}
  #drawCanvas{
    background:#ffffff;border-radius:16px;box-shadow:0 6px 0 rgba(46,42,74,0.15);
    touch-action:none;max-width:100%;max-height:100%;
  }

  /* ---------- Toolbar ---------- */
  #toolbar{
    display:none;flex-shrink:0;padding:8px 10px 14px;
  }
  #toolbar.visible{display:block;}
  .row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .swatch{
    width:34px;height:34px;border-radius:50%;border:3px solid #ffffffcc;
    box-shadow:0 2px 0 rgba(46,42,74,0.15);cursor:pointer;flex-shrink:0;
  }
  .swatch.selected{border-color:var(--ink);transform:scale(1.15);}
  .tool{
    border:none;border-radius:14px;background:#ffffffcc;padding:9px 12px;
    font-size:20px;line-height:1;cursor:pointer;box-shadow:0 3px 0 rgba(46,42,74,0.15);
    min-width:46px;
  }
  .tool.selected{background:var(--grape);color:#fff;}
  .tool:active{transform:translateY(2px);box-shadow:none;}
  .tool.wide{padding:9px 16px;font-size:14px;font-weight:800;font-family:'Baloo 2',sans-serif;}
  .sizebtn{
    border:none;border-radius:50%;background:#ffffffcc;cursor:pointer;
    box-shadow:0 3px 0 rgba(46,42,74,0.15);display:flex;align-items:center;justify-content:center;
  }
  .sizebtn.selected{background:var(--sun);}
  .sizebtn:active{transform:translateY(2px);box-shadow:none;}
  .sizebtn i{background:var(--ink);border-radius:50%;display:block;}

  #backBtn{position:fixed;top:10px;left:10px;z-index:5;}

  /* ---------- Desktop / larger screens: Paint-style window ---------- */
  .side-kid{
    display:none;
  }
  .credit-badge{
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    background:#ffffffaa;padding:4px 10px;border-radius:999px;
    margin:2px auto 0;width:fit-content;
  }
  .credit-badge .mark{
    height:22px;width:auto;flex-shrink:0;display:block;
    animation:logoBob 2.6s ease-in-out infinite;
  }
  @keyframes logoBob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-3px);}
  }
  .credit-badge:active,.credit-badge:hover{background:#ffffff;}
  @media (min-width: 900px){
    html,body{overflow:auto;}
    body{
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#9fd8ff 0%, #d9c9ff 100%);
      padding:16px 0;
      position:relative;
    }
    #app{
      max-width:1300px;width:92vw;height:94vh;max-height:900px;
      background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
      border-radius:14px;box-shadow:0 24px 70px rgba(30,20,60,0.4);
      display:flex;flex-direction:column;
      border:1px solid #ffffffcc;
      position:relative;
    }
    /* title bar, like a classic Paint / window app */
    header{
      flex-direction:row;justify-content:space-between;align-items:center;
      padding:10px 18px;gap:10px;
      background:linear-gradient(180deg,#ffffffb0,#ffffff60);
      border-bottom:1px solid #ffffffaa;
      border-radius:14px 14px 0 0;
    }
    header::before{
      content:"";
      display:block;
      width:44px;height:14px;flex-shrink:0;
      background-image:radial-gradient(circle,#FF6B6B 5px,transparent 6px),
                        radial-gradient(circle,#FFCB47 5px,transparent 6px),
                        radial-gradient(circle,#4CAF7D 5px,transparent 6px);
      background-position:0 50%, 16px 50%, 32px 50%;
      background-repeat:no-repeat;
      order:-1;margin-right:6px;
    }
    .group-photo{width:44px;border-radius:10px;}
    .brand{font-size:18px;gap:6px;}
    .modebar{gap:8px;}
    .modebtn{padding:8px 15px;font-size:14px;}
    #canvasWrap{padding:10px 16px;min-height:0;flex:1 1 auto;background:repeating-conic-gradient(#eef2fa 0% 25%, #e4e9f4 0% 50%) 0/18px 18px;border-radius:0;}
    #drawCanvas{max-height:100%;max-width:100%;}
    #gallery{min-height:0;padding:8px 20px 16px;}
    .grid{max-width:900px;grid-template-columns:repeat(5,1fr);}
    #toolbar{padding:8px 16px 14px;flex-shrink:0;background:#ffffffa0;border-radius:0 0 14px 14px;}
    .row{margin-bottom:6px;}

    /* decorative color photos of the kids filling the side space */
    .side-kid{
      display:block;position:fixed;top:50%;transform:translateY(-50%);
      width:min(15vw, 220px);border-radius:20px;
      box-shadow:0 14px 40px rgba(20,15,45,0.35);
      border:4px solid #ffffffdd;
      opacity:0.96;
    }
    .side-kid.left{left:max(1vw, 12px);}
    .side-kid.right{right:max(1vw, 12px);}

    /* Uplevel Web credit badge, corner of the window on desktop */
    .credit-row{position:relative;height:0;margin:0;}
    .credit-badge{
      position:absolute;right:2px;bottom:2px;margin:0;
      background:#ffffffcc;box-shadow:0 2px 6px rgba(30,20,60,0.15);
      z-index:5;
    }
  }
  @media (min-width: 1300px){
    .side-kid{width:min(13vw, 240px);}
  }
</style>

    history.push(ctx.getImageData(0,0,CW,CH));
    if(history.length > 25){ history.shift(); historyStep--; }
  }
  function restore(step){
    if(step<0 || step>=history.length) return;
    ctx.putImageData(history[step],0,0);
    historyStep = step;
  }
  function undo(){ restore(historyStep-1); }
  function redo(){ restore(historyStep+1); }

  function clearCanvas(bg){
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,CW,CH);
    if(bg) bg();
    pushHistory();
  }

  // ---------- coordinate helpers ----------
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches && e.touches[0] ? e.touches[0] : e;
    const x = (t.clientX - rect.left) * (CW/rect.width);
    const y = (t.clientY - rect.top) * (CH/rect.height);
    return {x,y};
  }

  // ---------- brush drawing ----------
  function startDraw(e){
    if(mode==='color' && currentTool==='bucket'){ doFill(getPos(e)); return; }
    drawing = true;
    const p = getPos(e);
    lastX = p.x; lastY = p.y;
    ctx.beginPath();
    ctx.arc(p.x,p.y,currentSize/2,0,Math.PI*2);
    ctx.fillStyle = currentTool==='eraser' ? '#ffffff' : currentColor;
    ctx.fill();
  }
  function moveDraw(e){
    if(!drawing) return;
    const p = getPos(e);
    ctx.strokeStyle = currentTool==='eraser' ? '#ffffff' : currentColor;
    ctx.lineWidth = currentSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  }
  function endDraw(){
    if(!drawing) return;
    drawing = false;
    pushHistory();
  }

  canvas.addEventListener('mousedown', e=>{startDraw(e);});
  canvas.addEventListener('mousemove', e=>{moveDraw(e);});
  window.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', e=>{e.preventDefault();startDraw(e);}, {passive:false});
  canvas.addEventListener('touchmove', e=>{e.preventDefault();moveDraw(e);}, {passive:false});
  canvas.addEventListener('touchend', e=>{e.preventDefault();endDraw();}, {passive:false});

  // ---------- flood fill (bucket) ----------
  function doFill(pos){
    const x0 = Math.floor(pos.x), y0 = Math.floor(pos.y);
    if(x0<0||y0<0||x0>=CW||y0>=CH) return;
    const img = ctx.getImageData(0,0,CW,CH);
    const data = img.data;
    const idx = (x,y)=>(y*CW+x)*4;
    const target = data.slice(idx(x0,y0), idx(x0,y0)+4);
    const fill = hexToRgba(currentColor);
    const tol = 60;
    function matches(i){
      return Math.abs(data[i]-target[0])<=tol &&
             Math.abs(data[i+1]-target[1])<=tol &&
             Math.abs(data[i+2]-target[2])<=tol;
    }
    if(fill[0]===target[0]&&fill[1]===target[1]&&fill[2]===target[2]) return;
    const stack = [[x0,y0]];
    const visited = new Uint8Array(CW*CH);
    while(stack.length){
      const [x,y] = stack.pop();
      if(x<0||x>=CW||y<0||y>=CH) continue;
      const vIdx = y*CW+x;
      if(visited[vIdx]) continue;
      const i = idx(x,y);
      if(!matches(i)) continue;
      visited[vIdx]=1;
      data[i]=fill[0]; data[i+1]=fill[1]; data[i+2]=fill[2]; data[i+3]=255;
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    ctx.putImageData(img,0,0);
    pushHistory();
  }
  function hexToRgba(hex){
    const v = parseInt(hex.slice(1),16);
    return [(v>>16)&255,(v>>8)&255,v&255,255];
  }

  // ---------- palette / toolbar ----------
  const paletteRow = document.getElementById('paletteRow');
  colors.forEach(c=>{
    const sw = document.createElement('div');
    sw.className='swatch'+(c===currentColor?' selected':'');
    sw.style.background=c;
    sw.addEventListener('click',()=>{
      currentColor=c;
      currentTool = currentTool==='eraser' ? 'brush' : currentTool;
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      setTool(currentTool);
    });
    paletteRow.appendChild(sw);
  });

  function setTool(t){
    currentTool=t;
    document.getElementById('brushTool').classList.toggle('selected', t==='brush');
    document.getElementById('bucketTool').classList.toggle('selected', t==='bucket');
    document.getElementById('eraserTool').classList.toggle('selected', t==='eraser');
  }
  document.getElementById('brushTool').addEventListener('click',()=>setTool('brush'));
  document.getElementById('bucketTool').addEventListener('click',()=>setTool('bucket'));
  document.getElementById('eraserTool').addEventListener('click',()=>setTool('eraser'));
  setTool('brush');

  function setSize(px, btnId){
    currentSize=px;
    document.querySelectorAll('.sizebtn').forEach(b=>b.classList.remove('selected'));
    document.getElementById(btnId).classList.add('selected');
  }

  document.getElementById('sizeM').addEventListener('click',()=>setSize(14,'sizeM'));
  document.getElementById('sizeL').addEventListener('click',()=>setSize(28,'sizeL'));

  document.getElementById('undoBtn').addEventListener('click',undo);
  document.getElementById('redoBtn').addEventListener('click',redo);
  document.getElementById('clearBtn').addEventListener('click',()=>{

    else { clearCanvas(); }
  });
  document.getElementById('saveBtn').addEventListener('click',()=>{
    const link = document.createElement('a');

    link.href = canvas.toDataURL('image/png');
    link.click();
  });

    idols: function(c){

      function star(sx,sy,sr){

    trex: function(c){

      // body
      g.beginPath();g.ellipse(cx,cy,s*1.6,s*1.1,0.1,0,Math.PI*2);g.stroke();
      // head
      g.beginPath();g.moveTo(cx+s*1.3,cy-s*0.3);g.lineTo(cx+s*2.6,cy-s*0.7);g.lineTo(cx+s*2.7,cy);g.lineTo(cx+s*2.5,cy+s*0.3);g.lineTo(cx+s*1.3,cy+s*0.2);g.closePath();g.stroke();
      // teeth line
      g.beginPath();g.moveTo(cx+s*1.8,cy+s*0.1);g.lineTo(cx+s*2.5,cy+s*0.15);g.stroke();
      // eye
      g.beginPath();g.arc(cx+s*2.1,cy-s*0.35,s*0.08,0,Math.PI*2);g.stroke();
      // small arm
      g.beginPath();g.moveTo(cx+s*0.6,cy-s*0.1);g.lineTo(cx+s*1.0,cy+s*0.15);g.stroke();
      // tail
      g.beginPath();g.moveTo(cx-s*1.5,cy-s*0.2);g.quadraticCurveTo(cx-s*2.6,cy-s*0.5,cx-s*2.9,cy-s*1.1);g.stroke();
      // legs
      g.beginPath();g.moveTo(cx-s*0.3,cy+s*0.9);g.lineTo(cx-s*0.5,cy+s*2.0);g.lineTo(cx-s*0.9,cy+s*2.0);g.stroke();
      g.beginPath();g.moveTo(cx+s*0.6,cy+s*0.9);g.lineTo(cx+s*0.8,cy+s*2.0);g.lineTo(cx+s*1.2,cy+s*2.0);g.stroke();
      // back ridges
      for(let i=-1;i<=1;i++){
        g.beginPath();g.moveTo(cx+i*s*0.5,cy-s*1.0);g.lineTo(cx+i*s*0.5+s*0.15,cy-s*1.35);g.lineTo(cx+i*s*0.5+s*0.3,cy-s*1.0);g.stroke();
      }
    },
    triceratops: function(c){
      const g=c.getContext('2d'); strokeOn(g);
      const cx=CW*0.48, cy=CH*0.55, s=CW*0.1;
      // body
      g.beginPath();g.ellipse(cx,cy,s*1.9,s*1.0,0,0,Math.PI*2);g.stroke();
      // frill (head shield)
      g.beginPath();g.arc(cx-s*2.0,cy-s*0.1,s*1.1,-Math.PI*0.65,Math.PI*0.65);g.stroke();
      // head
      g.beginPath();g.ellipse(cx-s*1.9,cy,s*0.75,s*0.55,0,0,Math.PI*2);g.stroke();
      // horns
      g.beginPath();g.moveTo(cx-s*2.3,cy-s*0.5);g.lineTo(cx-s*2.6,cy-s*1.3);g.stroke();
      g.beginPath();g.moveTo(cx-s*1.6,cy-s*0.55);g.lineTo(cx-s*1.7,cy-s*1.25);g.stroke();
      g.beginPath();g.moveTo(cx-s*2.6,cy+s*0.15);g.lineTo(cx-s*3.1,cy+s*0.25);g.stroke();
      // eye
      g.beginPath();g.arc(cx-s*1.95,cy-s*0.1,s*0.08,0,Math.PI*2);g.stroke();
      // legs
      g.beginPath();g.moveTo(cx-s*0.9,cy+s*0.85);g.lineTo(cx-s*1.0,cy+s*1.7);g.lineTo(cx-s*1.4,cy+s*1.7);g.stroke();
      g.beginPath();g.moveTo(cx+s*0.9,cy+s*0.85);g.lineTo(cx+s*1.0,cy+s*1.7);g.lineTo(cx+s*1.4,cy+s*1.7);g.stroke();
      // tail
      g.beginPath();g.moveTo(cx+s*1.85,cy);g.quadraticCurveTo(cx+s*2.6,cy-s*0.3,cx+s*2.8,cy-s*0.9);g.stroke();
    },
    estego: function(c){
      const g=c.getContext('2d'); strokeOn(g);
      const cx=CW*0.48, cy=CH*0.55, s=CW*0.1;
      // body (arched back)
      g.beginPath();
      g.moveTo(cx-s*2.2,cy+s*0.5);
      g.quadraticCurveTo(cx-s*1.2,cy-s*1.2,cx,cy-s*1.0);
      g.quadraticCurveTo(cx+s*1.3,cy-s*0.8,cx+s*2.1,cy+s*0.3);
      g.quadraticCurveTo(cx+s*1.0,cy+s*0.9,cx-s*1.0,cy+s*0.9);
      g.quadraticCurveTo(cx-s*1.9,cy+s*0.9,cx-s*2.2,cy+s*0.5);
      g.closePath();g.stroke();
      // head
      g.beginPath();g.ellipse(cx-s*2.3,cy+s*0.55,s*0.55,s*0.35,0.3,0,Math.PI*2);g.stroke();
      g.beginPath();g.arc(cx-s*2.55,cy+s*0.4,s*0.06,0,Math.PI*2);g.stroke();
      // back plates
      const plateX=[-1.6,-1.0,-0.35,0.35,1.0,1.55];
      plateX.forEach(px=>{
        const bx=cx+px*s, by=cy-s*1.0-Math.abs(px)*s*0.05;
        g.beginPath();g.moveTo(bx-s*0.28,by+s*0.35);g.lineTo(bx,by-s*0.55);g.lineTo(bx+s*0.28,by+s*0.35);g.stroke();
      });
      // tail spikes
      g.beginPath();g.moveTo(cx+s*2.1,cy+s*0.3);g.lineTo(cx+s*3.0,cy-s*0.1);g.stroke();
      g.beginPath();g.moveTo(cx+s*2.6,cy-s*0.3);g.lineTo(cx+s*2.9,cy-s*0.9);g.stroke();
      g.beginPath();g.moveTo(cx+s*2.8,cy+s*0.2);g.lineTo(cx+s*3.2,cy+s*0.5);g.stroke();
      // legs
      g.beginPath();g.moveTo(cx-s*1.3,cy+s*0.85);g.lineTo(cx-s*1.35,cy+s*1.6);g.stroke();
      g.beginPath();g.moveTo(cx+s*0.9,cy+s*0.85);g.lineTo(cx+s*0.95,cy+s*1.6);g.stroke();
    },
        cumple: function(c){
      const g=c.getContext('2d');
      g.fillStyle='#ffffff';g.fillRect(0,0,CW,CH);
      if(cumpleImg.complete && cumpleImg.naturalWidth){
        // preserve the photo's real aspect ratio, centered, no stretching
        const iw = cumpleImg.naturalWidth, ih = cumpleImg.naturalHeight;
        const scale = Math.min(CW/iw, CH/ih);
        const dw = iw*scale, dh = ih*scale;
        const dx = (CW-dw)/2, dy = (CH-dh)/2;
        g.drawImage(cumpleImg, dx, dy, dw, dh);
      }
    }
  };
  function strokeOn(g){ g.strokeStyle='#2E2A4A'; g.lineWidth=6; g.lineJoin='round'; g.lineCap='round'; }

  let currentTemplateDraw = null;

  // build gallery thumbnails
  const grid = document.getElementById('grid');
  const names = {sol:'Sol', casa:'Casa', gato:'Gato', flor:'Flor', pez:'Pez', cohete:'Cohete', perro:'Perro', conejo:'Conejo', mariposa:'Mariposa', elefante:'Elefante', gatita:'Gatita', conejita:'Conejita', idols:'Idols', cumple:'Cumple', trex:'T-Rex', triceratops:'Triceratops', estego:'Estegosaurio'};
  const thumbCanvases = {};
  Object.keys(templates).forEach(key=>{
    const btn = document.createElement('button');
    btn.className='tpl';
    const thumb = document.createElement('canvas');
    thumb.width=180; thumb.height=120;
    thumbCanvases[key] = thumb;
    const tg = thumb.getContext('2d');
    tg.fillStyle='#fff'; tg.fillRect(0,0,180,120);
    drawScaled(templates[key], thumb, 180,120);
    btn.appendChild(thumb);
    const label = document.createElement('span');
    label.textContent = names[key];
    btn.appendChild(label);
    btn.addEventListener('click', ()=>openTemplate(key));
    grid.appendChild(btn);
  });

  window.refreshCumpleThumb = function(){
    const thumb = thumbCanvases['cumple'];
    if(!thumb) return;
    const tg = thumb.getContext('2d');
    tg.fillStyle='#fff'; tg.fillRect(0,0,180,120);
    drawScaled(templates['cumple'], thumb, 180,120);
  };

  function drawScaled(fn, targetCanvas, w, h){
    // draw the template scaled down onto a small canvas for the thumbnail
    const tmp = document.createElement('canvas');
    tmp.width=CW; tmp.height=CH;
    fn(tmp);
    const g = targetCanvas.getContext('2d');
    g.drawImage(tmp,0,0,CW,CH,0,0,w,h);
  }

  function openTemplate(key){
    currentTemplateDraw = ()=>{ templates[key](canvas); };
    clearCanvas(currentTemplateDraw);
    showCanvas();
  }

  // ---------- mode switching ----------
  const galleryEl = document.getElementById('gallery');
  const canvasWrapEl = document.getElementById('canvasWrap');
  const toolbarEl = document.getElementById('toolbar');
  const tabDraw = document.getElementById('tabDraw');
  const tabColor = document.getElementById('tabColor');

  function showGallery(){
    mode='color';
    galleryEl.classList.add('visible');
    canvasWrapEl.classList.remove('visible');
    toolbarEl.classList.remove('visible');
    tabDraw.classList.remove('active'); tabColor.classList.add('active');
  }
  function showCanvas(){
    galleryEl.classList.remove('visible');
    canvasWrapEl.classList.add('visible');
    toolbarEl.classList.add('visible');
  }
  function goFreeDraw(){
    mode='draw';
    currentTemplateDraw = null;
    tabColor.classList.remove('active'); tabDraw.classList.add('active');
    clearCanvas();
    showCanvas();
  }

  tabDraw.addEventListener('click', goFreeDraw);
  tabColor.addEventListener('click', showGallery);

  // ---------- init ----------
  goFreeDraw();
})();
</script>
</body>
</html>
